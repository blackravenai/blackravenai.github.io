<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="robots" content="noindex"/>
<title>BlackRaven AI LLC — App Legal Pages</title><style>
  :root{--bg:#050607;--ink:#ece9e2;--dim:#8a8a93;--accent:#7c6bff;--line:#1c1d22}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;padding:40px 20px}
  .wrap{max-width:720px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 24px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
  .row:hover{border-color:var(--accent)}.nm{flex:1;font-weight:600}
  .lk{font-size:12px;color:var(--dim);padding:3px 9px;border:1px solid var(--line);border-radius:999px}
  .lk:hover{color:var(--accent);border-color:var(--accent)}
</style></head><body><div class="wrap">
  <h1>App Legal Pages</h1>
  <p class="sub">Privacy, support &amp; terms for every BlackRaven AI LLC app · 2026-07-08</p>
  
    <a class="row" href="./the-telling/privacy">
      <span class="nm">The Telling</span>
      <span class="lk">privacy</span><span class="lk" data-h="./the-telling/support">support</span><span class="lk" data-h="./the-telling/terms">terms</span>
    </a>
</div>
<script>document.querySelectorAll('.lk[data-h]').forEach(function(el){el.style.cursor='pointer';
  el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();location.href=el.dataset.h;});});</script>
</body></html>

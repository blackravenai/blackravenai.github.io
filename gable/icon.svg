<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b3a"/>
      <stop offset="0.5" stop-color="#3a2f68"/>
      <stop offset="0.72" stop-color="#7a4a7e"/>
      <stop offset="0.9" stop-color="#c9694f"/>
      <stop offset="1" stop-color="#1e1b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dff5d0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#dff5d0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#dff5d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e37a5e"/>
      <stop offset="1" stop-color="#a84a38"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#f1e3c8" opacity="0.7">
    <circle cx="140" cy="120" r="3"/><circle cx="300" cy="80" r="2"/><circle cx="520" cy="150" r="2.5"/>
    <circle cx="760" cy="90" r="3"/><circle cx="900" cy="200" r="2"/><circle cx="650" cy="60" r="2"/>
    <circle cx="420" cy="230" r="1.8"/><circle cx="860" cy="330" r="2.2"/><circle cx="90" cy="300" r="2"/>
  </g>
  <!-- far town -->
  <g fill="#2d2650">
    <rect x="0" y="600" width="120" height="424"/><polygon points="-10,600 60,540 130,600"/>
    <rect x="120" y="640" width="90" height="400"/><polygon points="115,640 165,590 215,640"/>
    <rect x="820" y="610" width="110" height="420"/><polygon points="815,610 875,555 935,610"/>
    <rect x="920" y="650" width="120" height="400"/><polygon points="915,650 980,600 1045,650"/>
  </g>
  <!-- left roof -->
  <g>
    <rect x="0" y="700" width="330" height="324" fill="#3b2f52"/>
    <rect x="0" y="686" width="330" height="34" fill="url(#tile)"/>
    <rect x="0" y="682" width="330" height="8" fill="#f1e3c8"/>
    <rect x="60" y="600" width="46" height="90" fill="#a84a38"/><rect x="54" y="592" width="58" height="12" fill="#f1e3c8"/>
    <g fill="#16132a"><rect x="30" y="760" width="26" height="40"/><rect x="90" y="760" width="26" height="40"/><rect x="150" y="760" width="26" height="40"/><rect x="30" y="850" width="26" height="40"/><rect x="150" y="850" width="26" height="40"/></g>
    <g fill="#ffc783" opacity="0.8"><rect x="90" y="850" width="26" height="40"/><rect x="210" y="760" width="26" height="40"/></g>
  </g>
  <!-- right roof -->
  <g>
    <rect x="720" y="700" width="304" height="324" fill="#3a2a48"/>
    <rect x="720" y="686" width="304" height="34" fill="url(#tile)"/>
    <rect x="720" y="682" width="304" height="8" fill="#f1e3c8"/>
    <g fill="#16132a"><rect x="760" y="760" width="26" height="40"/><rect x="880" y="760" width="26" height="40"/><rect x="820" y="850" width="26" height="40"/><rect x="940" y="850" width="26" height="40"/></g>
    <g fill="#ffc783" opacity="0.8"><rect x="820" y="760" width="26" height="40"/><rect x="940" y="760" width="26" height="40"/><rect x="760" y="850" width="26" height="40"/></g>
    <!-- perfect mark -->
    <rect x="842" y="676" width="60" height="10" fill="#16132a"/>
  </g>
  <!-- the gas lamp on the right roof, lit -->
  <circle cx="990" cy="600" r="150" fill="url(#glow)"/>
  <rect x="984" y="560" width="8" height="126" fill="#16132a"/>
  <rect x="960" y="560" width="32" height="8" fill="#16132a"/>
  <rect x="948" y="520" width="34" height="48" fill="#16132a"/>
  <rect x="954" y="528" width="22" height="34" fill="#dff5d0"/>
  <!-- the ladder, laid across -->
  <g transform="translate(300,676)">
    <rect x="0" y="-14" width="470" height="12" rx="4" fill="#e8c98a"/>
    <rect x="0" y="16" width="470" height="12" rx="4" fill="#e8c98a"/>
    <g fill="#8a6a3c">
      <rect x="30" y="-12" width="10" height="38"/><rect x="80" y="-12" width="10" height="38"/><rect x="130" y="-12" width="10" height="38"/>
      <rect x="180" y="-12" width="10" height="38"/><rect x="230" y="-12" width="10" height="38"/><rect x="280" y="-12" width="10" height="38"/>
      <rect x="330" y="-12" width="10" height="38"/><rect x="380" y="-12" width="10" height="38"/><rect x="430" y="-12" width="10" height="38"/>
    </g>
    <!-- the name tag -->
    <line x1="235" y1="28" x2="235" y2="62" stroke="#16132a" stroke-width="4"/>
    <rect x="170" y="60" width="130" height="52" rx="6" fill="#f1e3c8"/>
    <rect x="186" y="80" width="98" height="12" rx="6" fill="#d9694f"/>
  </g>
  <!-- the apprentice, mid-crossing -->
  <g transform="translate(470,662)">
    <rect x="-16" y="-34" width="12" height="34" fill="#16132a"/><rect x="6" y="-34" width="12" height="34" fill="#16132a"/>
    <polygon points="-26,-34 -20,-110 22,-110 30,-34" fill="#6f6b7a"/>
    <rect x="-3" y="-106" width="8" height="60" fill="#3d3948"/>
    <circle cx="1" cy="-130" r="22" fill="#e8c9a8"/>
    <rect x="-28" y="-154" width="58" height="12" fill="#16132a"/><rect x="-22" y="-168" width="44" height="16" fill="#16132a"/>
    <rect x="-66" y="-122" width="132" height="6" fill="#d7b27a"/><rect x="-66" y="-136" width="132" height="6" fill="#d7b27a"/>
    <g fill="#d7b27a"><rect x="-56" y="-136" width="6" height="20"/><rect x="-28" y="-136" width="6" height="20"/><rect x="0" y="-136" width="6" height="20"/><rect x="28" y="-136" width="6" height="20"/><rect x="54" y="-136" width="6" height="20"/></g>
  </g>
  <!-- swallows -->
  <g fill="none" stroke="#120f26" stroke-width="5" stroke-linecap="round">
    <path d="M560 300 q 20 18 40 0"/><path d="M600 340 q 16 14 32 0"/><path d="M640 280 q 14 12 28 0"/>
  </g>
</svg>
